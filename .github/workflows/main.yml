name: ACEest Fitness CI/CD

on:
  push:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build and lint Python application
        run: |
          python -m py_compile app.py test_app.py

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness:latest .

      - name: Run automated tests inside Docker container
        run: |
          docker run --rm --entrypoint python aceest-fitness:latest -m pytest -vname: ACEest Fitness CI/CD

